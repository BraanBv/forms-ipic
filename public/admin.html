<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel · Registros</title><link rel="stylesheet" href="styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script></head><body>
<div class="wrap" id="login"><div class="card"><h1>Acceso al panel</h1>
<label>Usuario</label><input id="u" autocomplete="username"><label>Contraseña</label><input id="p" type="password" autocomplete="current-password">
<button id="go">Entrar</button><div class="err" id="err"></div></div></div>
<div class="wrap wide hidden" id="panel"><div class="card"><h1>Registros: <span id="total"></span></h1></div>
<div class="grid"><div class="card"><canvas id="c1"></canvas></div><div class="card"><canvas id="c2"></canvas></div><div class="card"><canvas id="c3"></canvas></div></div>
<div class="card" style="overflow-x:auto"><table><thead><tr><th>Nombre</th><th>Género</th><th>Correo</th><th>Celular</th><th>Nivel</th><th>Carrera</th><th>Fecha</th></tr></thead><tbody id="tb"></tbody></table></div></div>
<script src="admin.js"></script></body></html>
